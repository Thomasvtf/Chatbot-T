<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot básico</title>
  <link rel="stylesheet" href="{{url_for('static', path='/css/styles.css')}}">
</head>

<body>
  <header>
    <div class="logo">
      <img src="{{ url_for('static', path='/img/logo.jpg')}}" alt="">
    </div>
    <div class="titulo">
      <h1>RuneBot - SENA CENIGRAF</h1>
    </div>
  </header>
  <div class="contenedor">
    <div class="preguntas-frecuentes">
      <h2>Preguntas frecuentes</h2>
      <div class="botones-pf">
        <button class="btn-pf">¿Qué programas ofrece CENIGRAF?</button>
        <button class="btn-pf">¿Cuáles son los requisitos de inscrición?</button>
        <button class="btn-pf">¿Cómo es el proceso de matricula?</button>
        <button class="btn-pf">¿Dónde se encuentra CENIGRAF?</button>
        <button class="btn-pf">¿Cuáles son los horarios?</button>
      </div>
    </div>
    <div class="contenedor-chat">
      <div>
        <button class="button-limpiar">LIMPIAR CHAT</button>
      </div>
      <div id="chat" aria-live="polite">
        <p class="message">RuneBot: Hola. 🤖 Soy RuneBot, ¿En qué te puedo ayudar hoy?</p>
      </div>
      <div id="typing-indicator" class="typing-indicator" style="display:none;">
        <span></span><span></span><span></span>
        <small>RuneBot está escribiendo…</small>
      </div>
      <form id="form">
        <input id="message" autocomplete="off" placeholder="Escribe tu mensaje…" required maxlength="2000">
        <button class="boton-enviar" type="submit">ENVIAR<img src="/static/img/enviar.png" alt=""
            class="img-enviar"></button>
      </form>
    </div>
  </div>
  <script>
    const chat = document.querySelector('#chat');
    const form = document.querySelector('#form');
    const input = document.querySelector('#message');

    function addMessage(who, text) {
      const p = document.createElement('p');
      p.className = 'message';
      p.textContent = `${who}: ${text}`;
      chat.appendChild(p);
      chat.scrollTop = chat.scrollHeight;
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage('Tú', message);
      input.value = '';
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        if (!response.ok) throw new Error('No se pudo obtener una respuesta.');
        const data = await response.json();
        addMessage('RuneBot', data.reply);
      } catch (error) {
        addMessage('RuneBot', `Error: ${error.message}`);
      }
    });
  </script>
</body>

</html>
